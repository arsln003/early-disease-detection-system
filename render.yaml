services:
  - type: web
    name: nestjs-backend
    runtime: node
    rootDir: nestjs-backend
    buildCommand: npm install && npm run build
    startCommand: node dist/main.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PYTHON_API_URL
        sync: false

  - type: web
    name: python-api
    runtime: python
    rootDir: python-api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT